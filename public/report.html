<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户洞察报告 - 可视化分析</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.min.js"></script>
    <script>
        // 备用Chart.js加载
        if (typeof Chart === 'undefined') {
            console.log('主CDN加载失败，尝试备用CDN');
            document.write('<script src="https://unpkg.com/chart.js@4.4.1/dist/chart.min.js"><\/script>');
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .header .meta {
            color: #666;
            font-size: 16px;
        }

        .overview-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .overview-card {
            background: linear-gradient(135deg, #f8f9ff, #e8f0ff);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .overview-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .overview-card .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .overview-card .value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .chart-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
            margin-right: 12px;
        }

        .chart-container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .radar-chart {
            max-width: 600px;
            margin: 0 auto;
        }

        .dimensions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .dimension-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .dimension-card:hover {
            transform: translateY(-3px);
        }

        .dimension-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .dimension-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .dimension-score {
            font-size: 20px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 8px;
            color: white;
        }

        .risk-green { background: linear-gradient(135deg, #4CAF50, #45a049); }
        .risk-yellow { background: linear-gradient(135deg, #FFC107, #FF9800); }
        .risk-red { background: linear-gradient(135deg, #F44336, #D32F2F); }
        .risk-blue { background: linear-gradient(135deg, #2196F3, #1976D2); }
        .risk-orange { background: linear-gradient(135deg, #FF9800, #F57C00); }

        .dimension-level {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s ease;
        }

        .insights-section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .insight-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .insight-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .suggestions-list {
            list-style: none;
        }

        .suggestions-list li {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
        }

        .suggestions-list li:last-child {
            border-bottom: none;
        }

        .suggestions-list li::before {
            content: '💡';
            margin-right: 12px;
            font-size: 16px;
        }

        .feedback-section {
            background: linear-gradient(135deg, #f8f9ff, #e8f0ff);
            border-radius: 16px;
            padding: 30px;
            border: 2px dashed #667eea;
        }

        .feedback-content {
            font-style: italic;
            color: #555;
            line-height: 1.6;
            font-size: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .back-btn::before {
            content: '←';
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .overview-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .dimensions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>用户洞察报告</h1>
            <div class="meta">
                <span>用户：<span id="user-name">加载中...</span></span>
                <span style="margin-left: 20px;">提交时间：<span id="submit-time">加载中...</span></span>
                <span style="margin-left: 20px;">答卷 ID：<span id="user-id">加载中...</span></span>
            </div>
        </div>

        <div class="overview-cards">
            <div class="overview-card">
                <div class="label">创作资历</div>
                <div class="value" id="experience-level">中级</div>
            </div>
            <div class="overview-card">
                <div class="label">预算能力</div>
                <div class="value" id="budget-level">中等</div>
            </div>
            <div class="overview-card">
                <div class="label">AI 采纳频率</div>
                <div class="value" id="ai-usage-level">活跃</div>
            </div>
            <div class="overview-card">
                <div class="label">增长目标</div>
                <div class="value" id="growth-level">积极</div>
            </div>
        </div>

        <div class="chart-section">
            <h2 class="section-title">维度能力雷达图</h2>
            <div class="chart-container">
                <div class="radar-chart">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>

        <div class="chart-section">
            <h2 class="section-title">详细维度评分</h2>
            <div class="dimensions-grid" id="dimensions-container">
                <!-- 动态生成维度卡片 -->
            </div>
        </div>

        <div class="chart-section">
            <h2 class="section-title">关键洞察</h2>
            <div class="insights-section" id="insights-container">
                <!-- 动态生成洞察内容 -->
            </div>
        </div>

        <div class="chart-section">
            <h2 class="section-title">建议关注点</h2>
            <div class="insights-section">
                <ul class="suggestions-list" id="suggestions-list">
                    <!-- 动态生成建议列表 -->
                </ul>
            </div>
        </div>

        <div class="chart-section">
            <h2 class="section-title">开放性反馈</h2>
            <div class="feedback-section">
                <div class="feedback-content" id="feedback-content">
                    "我希望能够更好地利用AI工具来提升内容创作效率，特别是在选题策划和数据分析方面。目前最大的挑战是如何平衡内容质量和产出频率，同时保持个人品牌的独特性。期望通过系统的学习和工具支持，能够在未来12个月内实现收入的显著增长。"
                </div>
            </div>
        </div>

        <a href="/admin" class="back-btn">返回管理面板</a>
    </div>

    <script>
        // 默认数据结构（将被真实数据替换）
        let reportData = {
            user_id: '加载中...',
            user_name: '加载中...',
            submit_time: '加载中...',
            overview: {
                experience: '加载中...',
                budget: '加载中...',
                ai_usage: '加载中...',
                growth: '加载中...'
            },
            dimensions: [],
            insights: [],
            suggestions: [],
            feedback: '正在加载数据...'
        };

        // 初始化页面
        function initializePage() {
            console.log('开始初始化页面，Chart.js状态:', typeof Chart);
            
            // 更新基本信息
            document.getElementById('user-name').textContent = reportData.user_name || '未知用户';
            document.getElementById('submit-time').textContent = reportData.submit_time;
            document.getElementById('user-id').textContent = reportData.user_id;
            document.getElementById('experience-level').textContent = reportData.overview.experience;
            document.getElementById('budget-level').textContent = reportData.overview.budget;
            document.getElementById('ai-usage-level').textContent = reportData.overview.ai_usage;
            document.getElementById('growth-level').textContent = reportData.overview.growth;

            // 只有在有数据时才创建图表
            if (reportData.dimensions && reportData.dimensions.length > 0) {
                // 延迟创建图表，确保DOM完全渲染
                setTimeout(() => {
                    console.log('创建雷达图，Chart.js状态:', typeof Chart);
                    createRadarChart();
                }, 200);
                createDimensionCards();
            }

            // 创建洞察内容
            createInsights();

            // 创建建议列表
            createSuggestions();

            // 更新反馈内容
            document.getElementById('feedback-content').textContent = reportData.feedback;
            
            console.log('页面初始化完成');
        }

        // 创建雷达图
        function createRadarChart() {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            
            // 检查Chart.js是否加载
            if (typeof Chart === 'undefined') {
                console.error('Chart.js 未加载，显示备用图表');
                drawBackupRadarChart(ctx, canvas);
                return;
            }
            
            if (!reportData.dimensions || reportData.dimensions.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', ctx.canvas.width/2, ctx.canvas.height/2);
                return;
            }
            
            const labels = reportData.dimensions.map(d => d.name);
            const data = reportData.dimensions.map(d => (d.score / d.max) * 100);

            try {
                new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '能力评分',
                        data: data,
                        backgroundColor: 'rgba(102, 126, 234, 0.2)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(102, 126, 234, 1)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                stepSize: 20,
                                font: {
                                    size: 12
                                }
                            },
                            pointLabels: {
                                font: {
                                    size: 11
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
            } catch (error) {
                console.error('创建雷达图失败:', error);
                ctx.fillStyle = '#f44336';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('图表创建失败', ctx.canvas.width/2, ctx.canvas.height/2);
            }
        }

        // 创建维度卡片
        function createDimensionCards() {
            const container = document.getElementById('dimensions-container');
            container.innerHTML = ''; // 清空容器
            
            if (!reportData.dimensions || reportData.dimensions.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666; padding: 40px;">暂无维度数据</div>';
                return;
            }
            
            reportData.dimensions.forEach(dimension => {
                const card = document.createElement('div');
                card.className = 'dimension-card';
                
                const percentage = (dimension.score / dimension.max) * 100;
                
                card.innerHTML = `
                    <div class="dimension-header">
                        <div class="dimension-name">${dimension.name}</div>
                        <div class="dimension-score risk-${dimension.risk}">${dimension.score}/${dimension.max}</div>
                    </div>
                    <div class="dimension-level">等级: ${dimension.level}</div>
                    <div class="progress-bar">
                        <div class="progress-fill risk-${dimension.risk}" style="width: ${percentage}%"></div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // 创建洞察内容
        function createInsights() {
            const container = document.getElementById('insights-container');
            container.innerHTML = ''; // 清空容器
            
            if (!reportData.insights || reportData.insights.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">暂无关键洞察</div>';
                return;
            }
            
            reportData.insights.forEach(insight => {
                const item = document.createElement('div');
                item.className = 'insight-item';
                
                const iconColor = insight.type === 'warning' ? '#FF9800' : '#F44336';
                const iconText = insight.type === 'warning' ? '⚠' : '🚨';
                
                item.innerHTML = `
                    <div class="insight-icon" style="background: ${iconColor}">
                        ${iconText}
                    </div>
                    <div>${insight.text}</div>
                `;
                
                container.appendChild(item);
            });
        }

        // 创建建议列表
        function createSuggestions() {
            const list = document.getElementById('suggestions-list');
            list.innerHTML = ''; // 清空列表
            
            if (!reportData.suggestions || reportData.suggestions.length === 0) {
                list.innerHTML = '<li style="border: none;">暂无建议</li>';
                return;
            }
            
            reportData.suggestions.forEach(suggestion => {
                const item = document.createElement('li');
                item.textContent = suggestion;
                list.appendChild(item);
            });
        }

        // 备用雷达图绘制函数（纯Canvas实现）
        function drawBackupRadarChart(ctx, canvas) {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 50;
            
            if (!reportData.dimensions || reportData.dimensions.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', centerX, centerY);
                return;
            }
            
            const dimensions = reportData.dimensions;
            const angleStep = (2 * Math.PI) / dimensions.length;
            
            // 清空画布
            ctx.clearRect(0, 0, width, height);
            
            // 绘制背景网格
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 5; i++) {
                const r = (radius * i) / 5;
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, 2 * Math.PI);
                ctx.stroke();
            }
            
            // 绘制轴线
            for (let i = 0; i < dimensions.length; i++) {
                const angle = i * angleStep - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.stroke();
                
                // 绘制标签
                const labelX = centerX + (radius + 20) * Math.cos(angle);
                const labelY = centerY + (radius + 20) * Math.sin(angle);
                ctx.fillStyle = '#333';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(dimensions[i].name, labelX, labelY);
            }
            
            // 绘制数据多边形
            ctx.beginPath();
            ctx.strokeStyle = '#667eea';
            ctx.fillStyle = 'rgba(102, 126, 234, 0.2)';
            ctx.lineWidth = 2;
            
            for (let i = 0; i < dimensions.length; i++) {
                const angle = i * angleStep - Math.PI / 2;
                const value = (dimensions[i].score / dimensions[i].max) * radius;
                const x = centerX + value * Math.cos(angle);
                const y = centerY + value * Math.sin(angle);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // 绘制数据点
            ctx.fillStyle = '#667eea';
            for (let i = 0; i < dimensions.length; i++) {
                const angle = i * angleStep - Math.PI / 2;
                const value = (dimensions[i].score / dimensions[i].max) * radius;
                const x = centerX + value * Math.cos(angle);
                const y = centerY + value * Math.sin(angle);
                
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        // 显示加载状态
        function showLoading() {
            document.querySelector('.container').innerHTML = `
                <div style="text-align: center; padding: 100px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">⏳</div>
                    <h2 style="color: #667eea;">正在加载数据...</h2>
                    <p style="color: #666;">请稍候，正在分析您的问卷数据</p>
                </div>
            `;
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async () => {
            const userId = getUserIdFromUrl();
            console.log('获取到的用户ID:', userId);
            
            if (!userId) {
                document.querySelector('.container').innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h2 style="color: #f44336;">缺少用户ID</h2>
                        <p style="color: #666;">请从管理面板访问报告</p>
                        <a href="/admin" style="color: #667eea;">返回管理面板</a>
                    </div>
                `;
                return;
            }
            
            // 显示加载状态
            showLoading();
            
            try {
                const data = await fetchReportData(userId);
                console.log('获取到的数据:', data);
                if (data) {
                    // 完全替换reportData
                    reportData = data;
                    // 重新渲染页面内容
                    renderPageContent();
                    // 等待DOM更新后再初始化
                    setTimeout(() => {
                        initializePage();
                    }, 100);
                } else {
                    console.error('未获取到数据');
                    document.querySelector('.container').innerHTML = `
                        <div style="text-align: center; padding: 50px;">
                            <h2 style="color: #f44336;">未获取到数据</h2>
                            <p style="color: #666;">请检查用户ID是否正确</p>
                            <a href="/admin" style="color: #667eea;">返回管理面板</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('数据加载失败:', error);
                document.querySelector('.container').innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h2 style="color: #f44336;">数据加载失败</h2>
                        <p style="color: #666;">错误信息: ${error.message}</p>
                        <a href="/admin" style="color: #667eea;">返回管理面板</a>
                    </div>
                `;
            }
        });

        // 渲染页面内容
        function renderPageContent() {
            document.querySelector('.container').innerHTML = `
                <div class="header">
                    <h1>用户洞察报告</h1>
                    <div class="meta">
                        <span>用户：<span id="user-name">加载中...</span></span>
                        <span style="margin-left: 20px;">提交时间：<span id="submit-time">加载中...</span></span>
                        <span style="margin-left: 20px;">答卷 ID：<span id="user-id">加载中...</span></span>
                    </div>
                </div>

                <div class="overview-cards">
                    <div class="overview-card">
                        <div class="label">创作资历</div>
                        <div class="value" id="experience-level">中级</div>
                    </div>
                    <div class="overview-card">
                        <div class="label">预算能力</div>
                        <div class="value" id="budget-level">中等</div>
                    </div>
                    <div class="overview-card">
                        <div class="label">AI 采纳频率</div>
                        <div class="value" id="ai-usage-level">活跃</div>
                    </div>
                    <div class="overview-card">
                        <div class="label">增长目标</div>
                        <div class="value" id="growth-level">积极</div>
                    </div>
                </div>

                <div class="chart-section">
                    <h2 class="section-title">维度能力雷达图</h2>

        // 从URL参数获取用户ID
        function getUserIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // 获取报告数据
        async function fetchReportData(userId) {
            try {
                console.log('正在获取数据，用户ID:', userId);
                const response = await fetch(`/api/report-data?id=${userId}`);
                console.log('响应状态:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('成功获取数据:', data);
                return data;
            } catch (error) {
                console.error('获取报告数据失败:', error);
                // 显示错误信息但不使用alert
                document.querySelector('.container').innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h2 style="color: #f44336;">数据加载失败</h2>
                        <p style="color: #666; margin: 20px 0;">错误信息: ${error.message}</p>
                        <a href="/admin" style="color: #667eea;">返回管理面板</a>
                    </div>
                `;
                return null;
            }
        }


    </script>
